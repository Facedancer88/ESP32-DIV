[main]
name = "tleilaxu"
lang = "en"
iface = "wlan0mon"
mon_start_cmd = "/usr/bin/monstart"
mon_stop_cmd = "/usr/bin/monstop"
mon_max_blind_epochs = 5
no_restart = false
whitelist = [
    "Cassandra Complex",
]
confd = "/etc/pwnagotchi/conf.d/"
custom_plugins = "/etc/pwnagotchi/custom-plugins/"
custom_plugin_repos = [
    "https://github.com/jayofelony/pwnagotchi-torch-plugins/archive/master.zip",
    "https://github.com/Sniffleupagus/pwnagotchi_plugins/archive/master.zip",
    "https://github.com/NeonLightning/pwny/archive/master.zip",
    "https://github.com/marbasec/UPSLite_Plugin_1_3/archive/master.zip",
    "https://github.com/wpa-2/Pwnagotchi-Plugins/archive/master.zip",
    "https://github.com/cyberartemio/wardriver-pwnagotchi-plugin/archive/main.zip"
]

[main.plugins.auto_backup]
enabled = true
backup_location = "/etc/pwnagotchi/backups"

[main.plugins.auto-update]
enabled = true
install = true
interval = 1
token = ""

[main.plugins.bt-tether]
enabled = false
auto_reconnect = "true"
show_on_screen = "true"
show_mini_status = "true"
mini_status_position = [110, 0]
show_detailed_status = "true"
detailed_status_position = [0, 82]
reconnect_interval = 60
reconnect_fast_interval = 15
reconnect_failure_cooldown = 300
nap_connect_timeout = 20
fast_dhcp = "true"
reboot_on_stuck_bluetooth = "false"

[main.plugins.fix_services]
enabled = true

[main.plugins.gpio_buttons]
enabled = false

[main.plugins.gps]
enabled = false
speed = 19200
device = "/dev/ttyUSB0"

[main.plugins.gps_listener]
enabled = false

[main.plugins.grid]
enabled = false
report = true

[main.plugins.logtail]
enabled = false
max-lines = 10000

[main.plugins.memtemp]
enabled = true
scale = "celsius"
orientation = "horizontal"

[main.plugins.ohcapi]
enabled = false
api_key = ""

[main.plugins.pwndroid]
enabled = false
gateway = ""
display = "false"
display_altitude = "false"

[main.plugins.pisugarx]
enabled = false
rotation = false
default_display = "percentage"
lowpower_shutdown = true
lowpower_shutdown_level = 10
shutdown_delay = 45
max_charge_voltage_protection = "false"

[main.plugins.pwncrack]
enabled = false
key = ""

[main.plugins.session-stats]
enabled = false
save_directory = "/etc/pwnagotchi/sessions/"

[main.plugins.ups_hat_c]
enabled = false
label_on = "true"
shutdown = 5
bat_x_coord = 140
bat_y_coord = 0

[main.plugins.ups_lite]
enabled = false
shutdown = 2

[main.plugins.webcfg]
enabled = true

[main.plugins.pwnstore_ui]
enabled = true

[main.plugins.webgpsmap]
enabled = false

[main.plugins.wigle]
enabled = false
api_key = ""
cvs_dir = "/tmp"
donate = "false"
timeout = 30
position = [7, 85]

[main.plugins.wpa-sec]
enabled = false
api_key = ""
api_url = "https://wpa-sec.stanev.org"
download_results = false
show_pwd = false
single_files = false

[main.log]
path = "/etc/pwnagotchi/log/pwnagotchi.log"
path-debug = "/etc/pwnagotchi/log/pwnagotchi-debug.log"

[main.log.rotation]
enabled = true
size = "10M"

[personality]
advertise = false
deauth = true
associate = true
channels = []
min_rssi = -200
ap_ttl = 120
sta_ttl = 300
recon_time = 30
max_inactive_scale = 2
recon_inactive_multiplier = 2
hop_recon_time = 10
min_recon_time = 5
max_interactions = 3
max_misses_for_recon = 5
excited_num_epochs = 10
bored_num_epochs = 15
sad_num_epochs = 25
bond_encounters_factor = 20000
throttle_a = 0.4
throttle_d = 0.9

[ui]
invert = false
cursor = true
fps = 0.0

[ui.font]
name = "DejaVuSansMono"
size_offset = 0

[ui.web]
enabled = true
address = "::"
auth = false
username = "changeme"
password = "changeme"
origin = ""
port = 8080
on_frame = ""

[ui.display]
enabled = true
rotation = 180
type = "waveshare_4"

[bettercap]
handshakes = "/etc/pwnagotchi/handshakes"
silence = [
    "ble.device.new",
    "ble.device.lost",
    "ble.device.service.discovered",
    "ble.device.characteristic.discovered",
    "ble.device.disconnected",
    "ble.device.connected",
    "ble.connection.timeout",
    "wifi.client.new",
    "wifi.client.lost",
    "wifi.client.probe",
    "wifi.ap.new",
    "wifi.ap.lost",
    "mod.started"
]

[fs.memory]
enabled = true

[fs.memory.mounts.log]
enabled = true
mount = "/etc/pwnagotchi/log/"
size = "50M"
sync = 60
zram = true
rsync = true

[fs.memory.mounts.data]
enabled = true
mount = "/var/tmp/pwnagotchi"
size = "10M"
sync = 3600
zram = true
rsync = true
